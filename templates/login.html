<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — INVEST</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f6fa; margin: 0;
         display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card { background: white; padding: 40px 50px; border-radius: 12px;
          box-shadow: 0 4px 20px rgba(0,0,0,.1); width: 360px; max-width: 80%; }
  h1 { color: #0984e3; text-align: center; margin: 0 0 25px; }
  label { display: block; font-weight: 600; margin: 12px 0 5px; color: #2d3436; }
  input { width: 100%; padding: 10px; border: 1px solid #dcdde1; border-radius: 6px;
          box-sizing: border-box; font-size: 15px; }
  input:focus { outline: 2px solid #0984e3; border-color: #0984e3; }
  button { width: 100%; margin-top: 25px; padding: 12px; background: #0984e3; color: white;
           border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:hover { background: #0868c4; }
  .error { background: #ffe3e3; color: #c0392b; border: 1px solid #f5b7b1;
           padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }

  /* ===== Responsive: điện thoại ===== */
  @media (max-width: 480px) {
    .card { width: 100%; max-width: none; margin: 0 12px; padding: 28px 22px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>INVEST</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label for="taikhoan">Tài Khoản:</label>
      <input type="text" id="taikhoan" name="taikhoan" value="pb.ngocbich" autofocus required>
      <label for="matma">Mật Mã:</label>
      <input type="password" id="matma" name="matma" value="bich123" required>
      <button type="submit">Đăng nhập</button>
    </form>
  </div>
</body>
</html>
